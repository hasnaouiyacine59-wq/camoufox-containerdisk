apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: camoufox-stable-v12
parameters:
  - name: NAME
    value: camoufox-vm
  - name: PASSWORD
    value: ubuntu123
objects:
- apiVersion: kubevirt.io/v1
  kind: VirtualMachine
  metadata:
    name: ${NAME}
  spec:
    runStrategy: Manual
    template:
      spec:
        domain:
          cpu:
            cores: 2
          memory:
            guest: 4Gi
          devices:
            disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            interfaces:
            - name: default
              masquerade: {}
        networks:
        - name: default
          pod: {}
        volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/mylastres0rt05_redhat/camoufox-containerdisk:lab
            imagePullPolicy: Always
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: ubuntu
              password: ${PASSWORD}
              chpasswd: {expire: False}
              ssh_pwauth: true
              runcmd:
                - curl -fsSL https://raw.githubusercontent.com/hasnaouiyacine59-wq/camoufox-vm-boot/main/boot.sh | bash
