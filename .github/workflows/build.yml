name: Build & Push Containerdisk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify KVM
        run: ls /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile.rootfs') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build & push
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          IMAGE_TAG: dev
          DOCKER_BUILDKIT: 1
          BUILDX_CACHE_FROM: /tmp/.buildx-cache
          BUILDX_CACHE_TO: /tmp/.buildx-cache-new
        run: |
          chmod +x push-to-quay.sh
          ./push-to-quay.sh

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true
