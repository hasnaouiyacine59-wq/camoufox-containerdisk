name: Build & Push Containerdisk v2

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get install -y -qq qemu-utils libguestfs-tools

      - name: Build disk image
        run: |
          curl -L -o base.qcow2 https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
          qemu-img resize base.qcow2 30G

      - name: Install docker.io
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" \
            --entrypoint virt-customize painsec/virt-customize \
            -a /work/base.qcow2 \
            --run-command 'growpart /dev/sda 1' \
            --run-command 'resize2fs /dev/sda1' \
            --run-command 'apt-get update' \
            --run-command 'DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends containerd docker.io openvpn' \
            --run-command 'apt-get clean && rm -rf /var/lib/apt/lists/*' \
            --mkdir '/etc/docker' \
            --write '/etc/docker/daemon.json:{"data-root":"/mnt/data/docker"}' \
            --mkdir '/etc/systemd/system/docker.service.d' \
            --write '/etc/systemd/system/docker.service.d/data-root.conf:[Unit]\nAfter=mnt-data.mount\nRequires=mnt-data.mount\n\n[Service]\nExecStartPre=/bin/mkdir -p /mnt/data/docker\n' \
            --run-command 'systemctl daemon-reload'

      - name: Convert to raw
        run: qemu-img convert -f qcow2 -O raw base.qcow2 disk.img

      - name: Build & push containerdisk
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          printf 'FROM scratch\nADD disk.img /disk/\n' > Dockerfile.disk
          echo "$QUAY_TOKEN" | docker login quay.io -u "$QUAY_USER" --password-stdin
          docker build -f Dockerfile.disk -t "quay.io/${QUAY_USER}/camoufox-containerdisk:lab" .
          docker push "quay.io/${QUAY_USER}/camoufox-containerdisk:lab"
