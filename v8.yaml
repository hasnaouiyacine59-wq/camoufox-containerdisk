apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: camoufox-stable-v8
parameters:
  - name: NAME
    value: camoufox-vm
  - name: PASSWORD
    value: ubuntu123
objects:
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: ${NAME}-data
  spec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 40Gi
- apiVersion: kubevirt.io/v1
  kind: VirtualMachine
  metadata:
    name: ${NAME}
  spec:
    runStrategy: Always
    template:
      spec:
        domain:
          cpu:
            cores: 2
          memory:
            guest: 4Gi
          devices:
            disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            interfaces:
            - name: default
              masquerade: {}
        networks:
        - name: default
          pod: {}
        volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:22.04
        - name: datadisk
          persistentVolumeClaim:
            claimName: ${NAME}-data
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: ubuntu
              password: ${PASSWORD}
              chpasswd: {expire: False}
              ssh_pwauth: true
              runcmd:
                - |
                  exec > /var/log/boot.log 2>&1
                  m=/mnt/pvc
                  mkdir -p $m
                  blkid /dev/vdb || mkfs.ext4 /dev/vdb
                  mount /dev/vdb $m
                  echo "/dev/vdb $m ext4 defaults 0 2" >> /etc/fstab
                  mkdir -p $m/dk $m/ac $m/al
                  rm -rf /var/lib/docker && ln -s $m/dk /var/lib/docker
                  rm -rf /var/cache/apt && ln -s $m/ac /var/cache/apt
                  ip link set dev enp1s0 mtu 1350
                  apt-get update && apt-get install -y docker.io nordvpn
                  mkdir -p /etc/docker
                  printf '{"data-root":"/var/lib/docker","exec-opts":["native.cgroupdriver=cgroupfs"],"storage-driver":"overlay2"}' > /etc/docker/daemon.json
                  systemctl daemon-reload
                  systemctl enable --now nordvpnd containerd docker
                  nordvpn set technology openvpn && nordvpn set protocol tcp
                  nordvpn set ipv6 off && nordvpn whitelist add port 22
                  nohup sh -c "while true; do sleep 60; done" &
