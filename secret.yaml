apiVersion: v1
kind: Secret
metadata:
  name: camoufox-cloudinit
type: Opaque
stringData:
  bootstrap.sh: |
    #!/bin/bash
    set -e

    exec > /var/log/bootstrap.log 2>&1

    echo "[*] Bootstrap starting"

    # network wait
    for i in {1..20}; do
      ping -c1 8.8.8.8 && break
      sleep 2
    done

    echo "[*] Mounting PVC disk"
    DISK="/dev/vdb"

    if [ -b "$DISK" ]; then
      mkdir -p /mnt/pvc
      mkfs.ext4 -F $DISK || true
      mount $DISK /mnt/pvc || true
      echo "$DISK /mnt/pvc ext4 defaults 0 2" >> /etc/fstab
    fi

    echo "[*] Installing docker"
    apt-get update
    apt-get install -y docker.io curl

    systemctl enable docker
    systemctl start docker

    echo "[*] DONE"
    
  userData: |
    #cloud-config
    users:
      - name: ubuntu
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash

    ssh_pwauth: true
    chpasswd:
      expire: false

    runcmd:
      - [ bash, /var/lib/cloud/scripts/per-instance/bootstrap.sh ]
